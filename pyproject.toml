[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-rl"
version = "0.0.1"
description = "Open-source RL for satellite collision avoidance, built on bsk_rl/Basilisk with real conjunction data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Armaan Sayyad" }]

# Basilisk itself is NOT listed here — it must be installed separately first
# (see README "Installation"). It is not a normal transitive pip dependency;
# see docs/02-bsk_rl-architecture.md §8 and docs/12-architecture.md.
dependencies = [
  "bsk-rl>=1.3.4",
  "gymnasium>=0.29",
  "hapsira",
  # hapsira 0.18.0 (its only PyPI release as of Aug 2026) imports
  # astropy.coordinates.matrix_utilities.matrix_product, which astropy
  # removed in its 7.x line -- hapsira itself declares no upper bound, so
  # a plain `pip install hapsira` on a fresh environment pulls a broken
  # combination. Verified astropy 6.1.7 works, 7.2.2 doesn't; pinning
  # conservatively to the whole 6.x line. See docs/16-targeting-results.md.
  "astropy<7",
  "numpy",
  "scipy",
  "stable-baselines3>=2.0",
  "sgp4",
  "pandas",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "matplotlib",
  # orekit_jpype is dev/test-only (Pc cross-validation), never a runtime
  # dependency — see docs/04-collision-probability.md and
  # docs/12-architecture.md. Pulls in a JVM; install manually if you want
  # the cross-validation tests, not required for the rest of the suite.
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
