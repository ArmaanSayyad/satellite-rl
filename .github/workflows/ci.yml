name: CI
on:
  push:
    branches: [main, 'v2/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_physics:
        description: Install Basilisk and run the full physics suite
        type: boolean
        default: false

jobs:
  fast-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install math, training and service dependencies
        run: |
          pip install ruff pytest numpy scipy pandas 'astropy<7' hapsira stable-baselines3
          pip install -r web/backend/requirements.txt
          pip install -e . --no-deps
      - run: ruff check src tests scripts web/backend
      - run: python scripts/check_docs.py
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: web/frontend/test-results
  basilisk:
    if: github.event_name == 'workflow_dispatch' && inputs.full_physics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'bsk[all]' && pip install -e '.[dev]' -r web/backend/requirements.txt
      - run: python -m scripts.download_checkpoint
      - run: python -m pytest -q
      - name: Re-execute verified conjunction
        run: python -m scripts.generate_replays --events 8767 --policies never_maneuver --output artifacts/local/ci
      - name: Real service worker, cache, and cancellation contract
        run: APSIS_TEST_LIVE=1 python -m pytest tests/test_web_backend_live.py -q
